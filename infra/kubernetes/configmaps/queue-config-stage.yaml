apiVersion: v1
kind: ConfigMap
metadata:
  name: queue-config
  namespace: ai-finance
  labels:
    app: ai-finance
    environment: stage
    component: queue-configuration
data:
  # Stage SQS Queues
  TRANSACTIONS_QUEUE_URL: "https://sqs.us-east-1.amazonaws.com/123456789/ai-finance-transactions-queue-staging"
  ANALYTICS_QUEUE_URL: "https://sqs.us-east-1.amazonaws.com/123456789/ai-finance-analytics-queue-staging"
  
  # Environment info
  AWS_REGION: "us-east-1"
  ENVIRONMENT: "staging"
  
  # Queue settings
  QUEUE_POLLING_INTERVAL: "5000"
  QUEUE_MAX_MESSAGES: "10"
  QUEUE_WAIT_TIME: "20"