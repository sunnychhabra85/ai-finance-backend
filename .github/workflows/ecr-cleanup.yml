name: ECR Image Cleanup

on:
  schedule:
    # Run every Sunday at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      keep_count:
        description: 'Number of recent images to keep per service'
        required: false
        default: '10'
        type: string

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 014071048720.dkr.ecr.us-east-1.amazonaws.com

jobs:
  cleanup-ecr:
    name: Cleanup Old ECR Images
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service:
          - auth-service
          - upload-service
          - analytics-service
          - ai-service
          - parser-worker
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get image count before cleanup
        id: before
        run: |
          count=$(aws ecr describe-images \
            --repository-name ${{ matrix.service }} \
            --region ${{ env.AWS_REGION }} \
            --query 'length(imageDetails)' \
            --output text 2>/dev/null || echo "0")
          echo "count=$count" >> $GITHUB_OUTPUT
          echo "Images in ${{ matrix.service }}: $count"

      - name: Cleanup old images
        run: |
          KEEP_COUNT=${{ github.event.inputs.keep_count || '10' }}
          
          echo "Keeping latest $KEEP_COUNT images for ${{ matrix.service }}"
          
          # Get images sorted by push date (oldest first)
          images_to_delete=$(aws ecr describe-images \
            --repository-name ${{ matrix.service }} \
            --region ${{ env.AWS_REGION }} \
            --query "imageDetails | sort_by(@, &imagePushedAt)[0:-${KEEP_COUNT}].[imageDigest]" \
            --output text 2>/dev/null || echo "")
          
          if [ -z "$images_to_delete" ]; then
            echo "No images to delete for ${{ matrix.service }}"
            exit 0
          fi
          
          # Delete old images
          for digest in $images_to_delete; do
            echo "Deleting image: $digest"
            aws ecr batch-delete-image \
              --repository-name ${{ matrix.service }} \
              --image-ids imageDigest=$digest \
              --region ${{ env.AWS_REGION }} 2>/dev/null || echo "Failed to delete $digest"
          done

      - name: Get image count after cleanup
        id: after
        run: |
          count=$(aws ecr describe-images \
            --repository-name ${{ matrix.service }} \
            --region ${{ env.AWS_REGION }} \
            --query 'length(imageDetails)' \
            --output text 2>/dev/null || echo "0")
          echo "count=$count" >> $GITHUB_OUTPUT
          echo "Remaining images in ${{ matrix.service }}: $count"

      - name: Cleanup summary
        run: |
          echo "### Cleanup Summary for ${{ matrix.service }}"
          echo "Before: ${{ steps.before.outputs.count }} images"
          echo "After: ${{ steps.after.outputs.count }} images"
          echo "Deleted: $((${{ steps.before.outputs.count }} - ${{ steps.after.outputs.count }})) images"

  cleanup-untagged:
    name: Cleanup Untagged Images
    runs-on: ubuntu-latest
    needs: cleanup-ecr
    
    strategy:
      matrix:
        service:
          - auth-service
          - upload-service
          - analytics-service
          - ai-service
          - parser-worker
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Delete untagged images
        run: |
          echo "Deleting untagged images from ${{ matrix.service }}"
          
          # Get untagged images
          untagged=$(aws ecr list-images \
            --repository-name ${{ matrix.service }} \
            --region ${{ env.AWS_REGION }} \
            --filter "tagStatus=UNTAGGED" \
            --query 'imageIds[*]' \
            --output json 2>/dev/null || echo "[]")
          
          if [ "$untagged" == "[]" ]; then
            echo "No untagged images found"
            exit 0
          fi
          
          # Delete untagged images
          aws ecr batch-delete-image \
            --repository-name ${{ matrix.service }} \
            --image-ids "$untagged" \
            --region ${{ env.AWS_REGION }} 2>/dev/null || echo "No untagged images to delete"
          
          echo "Untagged images deleted successfully"

  summary:
    name: Cleanup Summary
    runs-on: ubuntu-latest
    needs: [cleanup-ecr, cleanup-untagged]
    if: always()
    
    steps:
      - name: Cleanup completed
        run: |
          echo "✅ ECR cleanup completed"
          echo "Date: $(date)"
          echo "Keep count: ${{ github.event.inputs.keep_count || '10' }} images per service"
