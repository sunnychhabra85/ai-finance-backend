name: CI - Build and Test

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop, feature/**]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'

jobs:
  # Detect which services changed
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      auth-service: ${{ steps.filter.outputs.auth-service }}
      upload-service: ${{ steps.filter.outputs.upload-service }}
      analytics-service: ${{ steps.filter.outputs.analytics-service }}
      ai-service: ${{ steps.filter.outputs.ai-service }}
      parser-worker: ${{ steps.filter.outputs.parser-worker }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth-service:
              - 'apps/auth-service/**'
              - 'packages/**'
              - 'package.json'
              - 'tsconfig.base.json'
            upload-service:
              - 'apps/upload-service/**'
              - 'packages/**'
              - 'package.json'
              - 'tsconfig.base.json'
            analytics-service:
              - 'apps/analytics-service/**'
              - 'packages/**'
              - 'package.json'
              - 'tsconfig.base.json'
            ai-service:
              - 'apps/ai-service/**'
              - 'packages/**'
              - 'package.json'
              - 'tsconfig.base.json'
            parser-worker:
              - 'apps/parser-worker/**'
              - 'packages/**'
              - 'package.json'
              - 'tsconfig.base.json'
            shared:
              - 'packages/**'
              - 'package.json'
              - 'tsconfig.base.json'

  # Lint and Build
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.auth-service == 'true' ||
      needs.detect-changes.outputs.upload-service == 'true' ||
      needs.detect-changes.outputs.analytics-service == 'true' ||
      needs.detect-changes.outputs.ai-service == 'true' ||
      needs.detect-changes.outputs.parser-worker == 'true' ||
      needs.detect-changes.outputs.shared == 'true'
    
    strategy:
      matrix:
        service:
          - auth-service
          - upload-service
          - analytics-service
          - ai-service
          - parser-worker
        include:
          - service: auth-service
            path: apps/auth-service
            changed: ${{ needs.detect-changes.outputs.auth-service == 'true' || needs.detect-changes.outputs.shared == 'true' }}
          - service: upload-service
            path: apps/upload-service
            changed: ${{ needs.detect-changes.outputs.upload-service == 'true' || needs.detect-changes.outputs.shared == 'true' }}
          - service: analytics-service
            path: apps/analytics-service
            changed: ${{ needs.detect-changes.outputs.analytics-service == 'true' || needs.detect-changes.outputs.shared == 'true' }}
          - service: ai-service
            path: apps/ai-service
            changed: ${{ needs.detect-changes.outputs.ai-service == 'true' || needs.detect-changes.outputs.shared == 'true' }}
          - service: parser-worker
            path: apps/parser-worker
            changed: ${{ needs.detect-changes.outputs.parser-worker == 'true' || needs.detect-changes.outputs.shared == 'true' }}
    
    steps:
      - name: Checkout code
        if: matrix.changed == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: matrix.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        if: matrix.changed == 'true'
        run: npm ci

      - name: Generate Prisma Client
        if: matrix.changed == 'true' && (matrix.service == 'auth-service' || matrix.service == 'upload-service' || matrix.service == 'analytics-service')
        run: npx prisma generate --schema=${{ matrix.path }}/prisma/schema.prisma

      - name: Lint
        if: matrix.changed == 'true'
        run: |
          cd ${{ matrix.path }}
          npm run lint || echo "No lint script found"
        continue-on-error: true

      - name: Build
        if: matrix.changed == 'true'
        run: |
          cd ${{ matrix.path }}
          npm run build

      - name: Run tests
        if: matrix.changed == 'true'
        run: |
          cd ${{ matrix.path }}
          npm test || echo "No tests found"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
        continue-on-error: true

  # Docker Build Test
  docker-build:
    name: Docker Build Test - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.auth-service == 'true' ||
      needs.detect-changes.outputs.upload-service == 'true' ||
      needs.detect-changes.outputs.analytics-service == 'true' ||
      needs.detect-changes.outputs.ai-service == 'true' ||
      needs.detect-changes.outputs.parser-worker == 'true'
    
    strategy:
      matrix:
        service:
          - auth-service
          - upload-service
          - analytics-service
          - ai-service
          - parser-worker
        include:
          - service: auth-service
            dockerfile: infra/docker/auth-service.Dockerfile
            changed: ${{ needs.detect-changes.outputs.auth-service }}
          - service: upload-service
            dockerfile: infra/docker/upload-service.Dockerfile
            changed: ${{ needs.detect-changes.outputs.upload-service }}
          - service: analytics-service
            dockerfile: infra/docker/analytics-service.Dockerfile
            changed: ${{ needs.detect-changes.outputs.analytics-service }}
          - service: ai-service
            dockerfile: infra/docker/ai-service.Dockerfile
            changed: ${{ needs.detect-changes.outputs.ai-service }}
          - service: parser-worker
            dockerfile: infra/docker/parser-worker.Dockerfile
            changed: ${{ needs.detect-changes.outputs.parser-worker }}
    
    steps:
      - name: Checkout code
        if: matrix.changed == 'true'
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        if: matrix.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        if: matrix.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.service }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Summary
  ci-status:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [build, docker-build]
    if: always()
    steps:
      - name: Check CI Status
        run: |
          if [ "${{ needs.build.result }}" == "failure" ] || [ "${{ needs.docker-build.result }}" == "failure" ]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed successfully"
