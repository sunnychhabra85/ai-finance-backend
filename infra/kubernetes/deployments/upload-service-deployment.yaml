apiVersion: apps/v1
kind: Deployment
metadata:
  name: upload-service
  namespace: ai-finance
  labels:
    app: upload-service
    version: v1
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: upload-service
  template:
    metadata:
      labels:
        app: upload-service
        version: v1
    spec:
      serviceAccountName: app-sa
      containers:
      - name: upload-service
        image: 014071048720.dkr.ecr.us-east-1.amazonaws.com/ai-finance/upload-service:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3002
          protocol: TCP
        
        envFrom:
        - configMapRef:
            name: app-config-dev
        - secretRef:
            name: app-secrets
        
        env:
        - name: SERVICE_NAME
          value: "upload-service"
        
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        
        # Health checks - Commented out until /health endpoint is implemented
        # livenessProbe:
        #   httpGet:
        #     path: /health
        #     port: 3002
        #   initialDelaySeconds: 30
        #   periodSeconds: 10
        #   timeoutSeconds: 3
        #   failureThreshold: 3
        # 
        # readinessProbe:
        #   httpGet:
        #     path: /health
        #     port: 3002
        #   initialDelaySeconds: 10
        #   periodSeconds: 5
        #   timeoutSeconds: 3
        #   failureThreshold: 3
        
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      
      volumes:
      - name: tmp
        emptyDir: {}
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - upload-service
              topologyKey: kubernetes.io/hostname