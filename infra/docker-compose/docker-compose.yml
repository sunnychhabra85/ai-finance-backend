services:
  # ============================================
  # PostgreSQL Database (SIMPLIFIED)
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: ai-finance-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - ai-finance-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ============================================
  # LocalStack
  # ============================================
  localstack:
    image: localstack/localstack:latest
    container_name: ai-finance-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,sqs
      DEBUG: 0
      DOCKER_HOST: unix:///var/run/docker.sock
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ai-finance-network
    restart: unless-stopped

  # ============================================
  # Zookeeper (Kafka dependency)
  # ============================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ai-finance-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - ai-finance-network
    restart: unless-stopped

  # ============================================
  # Kafka
  # ============================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ai-finance-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
      - "29092:29092"
    networks:
      - ai-finance-network
    restart: unless-stopped

  # ============================================
  # Auth Service
  # ============================================
  auth-service:
    build:
      context: ../..
      dockerfile: infra/docker/auth-service.Dockerfile
    container_name: ai-finance-auth-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/authservicedb
      JWT_SECRET: dev-secret-key-change-in-production
      JWT_EXPIRATION: 24h
      PORT: 3001
      LOG_LEVEL: debug
    ports:
      - "3001:3001"
    networks:
      - ai-finance-network
    restart: unless-stopped

  # ============================================
  # Upload Service
  # ============================================
  upload-service:
    build:
      context: ../..
      dockerfile: infra/docker/upload-service.Dockerfile
    container_name: ai-finance-upload-service
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/uploadservicedb
      AWS_S3_BUCKET: ai-finance-uploads
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT: http://localstack:4566
      PORT: 3002
      LOG_LEVEL: debug
    ports:
      - "3002:3002"
    networks:
      - ai-finance-network
    restart: unless-stopped

  # ============================================
  # Parser Worker
  # ============================================
  parser-worker:
    build:
      context: ../..
      dockerfile: infra/docker/parser-worker.Dockerfile
    container_name: ai-finance-parser-worker
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/parserworkerdb
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC_FILE_UPLOADED: file.uploaded
      KAFKA_TOPIC_CATEGORIZED: transaction.categorized
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-test-key}
      PORT: 3003
      LOG_LEVEL: debug
    ports:
      - "3003:3003"
    networks:
      - ai-finance-network
    restart: unless-stopped

  # ============================================
  # Analytics Service
  # ============================================
  analytics-service:
    build:
      context: ../..
      dockerfile: infra/docker/analytics-service.Dockerfile
    container_name: ai-finance-analytics-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/analyticsservicedb
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC_CATEGORIZED: transaction.categorized
      PORT: 3004
      LOG_LEVEL: debug
    ports:
      - "3004:3004"
    networks:
      - ai-finance-network
    restart: unless-stopped

  # ============================================
  # AI Service
  # ============================================
  ai-service:
    build:
      context: ../..
      dockerfile: infra/docker/ai-service.Dockerfile
    container_name: ai-finance-ai-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/aiservicedb
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-test-key}
      OPENAI_MODEL: gpt-4-turbo
      PORT: 3005
      LOG_LEVEL: debug
    ports:
      - "3005:3005"
    networks:
      - ai-finance-network
    restart: unless-stopped

  # ============================================
  # Nginx API Gateway
  # ============================================
  api-gateway:
    build:
      context: ../..
      dockerfile: infra/docker/nginx.Dockerfile
    container_name: ai-finance-api-gateway
    depends_on:
      - auth-service
      - upload-service
      - parser-worker
      - analytics-service
      - ai-service
    ports:
      - "80:80"
      - "443:443"
    networks:
      - ai-finance-network
    volumes:
      - ../docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

networks:
  ai-finance-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local