apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway
  namespace: ai-finance
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:your-account-id:certificate/your-cert-id"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
  - host: "api.yourdomain.com"
    http:
      paths:
      - path: /api/auth
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 3001
      
      - path: /api/upload
        pathType: Prefix
        backend:
          service:
            name: upload-service
            port:
              number: 3002
      
      - path: /api/parse
        pathType: Prefix
        backend:
          service:
            name: parser-worker
            port:
              number: 3003
      
      - path: /api/analytics
        pathType: Prefix
        backend:
          service:
            name: analytics-service
            port:
              number: 3004
      
      - path: /api/ai
        pathType: Prefix
        backend:
          service:
            name: ai-service
            port:
              number: 3005