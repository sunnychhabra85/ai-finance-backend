name: CD - Deploy to AWS EKS

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'infra/docker/**'
      - 'infra/kubernetes/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      service:
        description: 'Service to deploy (leave empty for all)'
        required: false
        type: choice
        options:
          - all
          - auth-service
          - upload-service
          - analytics-service
          - ai-service
          - parser-worker

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: ai-finance-eks-dev
  ECR_REGISTRY: 014071048720.dkr.ecr.us-east-1.amazonaws.com
  K8S_NAMESPACE: ai-finance

jobs:
  # Detect changes
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      auth-service: ${{ steps.filter.outputs.auth-service || github.event.inputs.service == 'auth-service' || github.event.inputs.service == 'all' }}
      upload-service: ${{ steps.filter.outputs.upload-service || github.event.inputs.service == 'upload-service' || github.event.inputs.service == 'all' }}
      analytics-service: ${{ steps.filter.outputs.analytics-service || github.event.inputs.service == 'analytics-service' || github.event.inputs.service == 'all' }}
      ai-service: ${{ steps.filter.outputs.ai-service || github.event.inputs.service == 'ai-service' || github.event.inputs.service == 'all' }}
      parser-worker: ${{ steps.filter.outputs.parser-worker || github.event.inputs.service == 'parser-worker' || github.event.inputs.service == 'all' }}
      deploy-any: ${{ steps.filter.outputs.any || github.event.inputs.service != '' }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            auth-service:
              - 'apps/auth-service/**'
              - 'packages/**'
              - 'infra/docker/auth-service.Dockerfile'
              - 'infra/docker/entrypoint-auth.sh'
              - 'infra/kubernetes/deployments/auth-service.yaml'
            upload-service:
              - 'apps/upload-service/**'
              - 'packages/**'
              - 'infra/docker/upload-service.Dockerfile'
              - 'infra/docker/entrypoint-upload.sh'
              - 'infra/kubernetes/deployments/upload-service.yaml'
            analytics-service:
              - 'apps/analytics-service/**'
              - 'packages/**'
              - 'infra/docker/analytics-service.Dockerfile'
              - 'infra/docker/entrypoint-analytics.sh'
              - 'infra/kubernetes/deployments/analytics-service.yaml'
            ai-service:
              - 'apps/ai-service/**'
              - 'packages/**'
              - 'infra/docker/ai-service.Dockerfile'
              - 'infra/kubernetes/deployments/ai-service.yaml'
            parser-worker:
              - 'apps/parser-worker/**'
              - 'packages/**'
              - 'infra/docker/parser-worker.Dockerfile'
              - 'infra/kubernetes/deployments/parser-worker.yaml'
            any:
              - 'apps/**'
              - 'packages/**'
              - 'infra/docker/**'
              - 'infra/kubernetes/**'

  # Build and Push Docker Images
  build-and-push:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.deploy-any == 'true'
    
    strategy:
      matrix:
        service:
          - auth-service
          - upload-service
          - analytics-service
          - ai-service
          - parser-worker
        include:
          - service: auth-service
            dockerfile: infra/docker/auth-service.Dockerfile
          - service: upload-service
            dockerfile: infra/docker/upload-service.Dockerfile
          - service: analytics-service
            dockerfile: infra/docker/analytics-service.Dockerfile
          - service: ai-service
            dockerfile: infra/docker/ai-service.Dockerfile
          - service: parser-worker
            dockerfile: infra/docker/parser-worker.Dockerfile
    
    steps:
      - name: Check if service changed
        id: should-deploy
        run: |
          if [ "${{ needs.detect-changes.outputs[matrix.service] }}" == "true" ]; then
            echo "deploy=true" >> $GITHUB_OUTPUT
          else
            echo "deploy=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        if: steps.should-deploy.outputs.deploy == 'true'
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: steps.should-deploy.outputs.deploy == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.should-deploy.outputs.deploy == 'true'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: steps.should-deploy.outputs.deploy == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        if: steps.should-deploy.outputs.deploy == 'true'
        id: meta
        run: |
          echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        if: steps.should-deploy.outputs.deploy == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:latest
            ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:${{ steps.meta.outputs.sha_short }}
            ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:${{ steps.meta.outputs.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        if: steps.should-deploy.outputs.deploy == 'true'
        run: echo "Pushed image - ${{ env.ECR_REGISTRY }}/${{ matrix.service }}:${{ steps.meta.outputs.sha_short }}"

  # Deploy to EKS
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-push]
    if: needs.detect-changes.outputs.deploy-any == 'true'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Verify cluster connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy ConfigMaps
        run: |
          kubectl apply -f infra/kubernetes/configmaps/ -n ${{ env.K8S_NAMESPACE }}

      - name: Deploy Secrets
        run: |
          # Check if secrets exist, if not create them
          kubectl get secret app-secrets -n ${{ env.K8S_NAMESPACE }} || \
          kubectl create secret generic app-secrets \
            --from-literal=JWT_SECRET='${{ secrets.JWT_SECRET }}' \
            --from-literal=OPENAI_API_KEY='${{ secrets.OPENAI_API_KEY }}' \
            -n ${{ env.K8S_NAMESPACE }}
          
          kubectl get secret db-credentials -n ${{ env.K8S_NAMESPACE }} || \
          kubectl create secret generic db-credentials \
            --from-literal=DATABASE_URL='${{ secrets.DATABASE_URL }}' \
            -n ${{ env.K8S_NAMESPACE }}

      - name: Deploy auth-service
        if: needs.detect-changes.outputs.auth-service == 'true'
        run: |
          kubectl apply -f infra/kubernetes/deployments/auth-service.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/kubernetes/services/auth-service.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout restart deployment/auth-service -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/auth-service -n ${{ env.K8S_NAMESPACE }} --timeout=5m

      - name: Deploy upload-service
        if: needs.detect-changes.outputs.upload-service == 'true'
        run: |
          kubectl apply -f infra/kubernetes/deployments/upload-service.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/kubernetes/services/upload-service.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout restart deployment/upload-service -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/upload-service -n ${{ env.K8S_NAMESPACE }} --timeout=5m

      - name: Deploy analytics-service
        if: needs.detect-changes.outputs.analytics-service == 'true'
        run: |
          kubectl apply -f infra/kubernetes/deployments/analytics-service.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/kubernetes/services/analytics-service.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout restart deployment/analytics-service -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/analytics-service -n ${{ env.K8S_NAMESPACE }} --timeout=5m

      - name: Deploy ai-service
        if: needs.detect-changes.outputs.ai-service == 'true'
        run: |
          kubectl apply -f infra/kubernetes/deployments/ai-service.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl apply -f infra/kubernetes/services/ai-service.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout restart deployment/ai-service -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/ai-service -n ${{ env.K8S_NAMESPACE }} --timeout=5m

      - name: Deploy parser-worker
        if: needs.detect-changes.outputs.parser-worker == 'true'
        run: |
          kubectl apply -f infra/kubernetes/deployments/parser-worker.yaml -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout restart deployment/parser-worker -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/parser-worker -n ${{ env.K8S_NAMESPACE }} --timeout=5m

      - name: Verify deployment
        run: |
          echo "=== Deployments ==="
          kubectl get deployments -n ${{ env.K8S_NAMESPACE }}
          echo ""
          echo "=== Pods ==="
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          echo ""
          echo "=== Services ==="
          kubectl get services -n ${{ env.K8S_NAMESPACE }}

      - name: Get service URLs
        run: |
          echo "=== Service URLs ==="
          kubectl get svc -n ${{ env.K8S_NAMESPACE }} -o wide | grep LoadBalancer

  # Post-deployment health checks
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy
    if: needs.detect-changes.outputs.deploy-any == 'true'
    
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Wait for pods to be ready
        run: |
          kubectl wait --for=condition=ready pod -l app=auth-service -n ${{ env.K8S_NAMESPACE }} --timeout=300s || true
          kubectl wait --for=condition=ready pod -l app=upload-service -n ${{ env.K8S_NAMESPACE }} --timeout=300s || true
          kubectl wait --for=condition=ready pod -l app=analytics-service -n ${{ env.K8S_NAMESPACE }} --timeout=300s || true
          kubectl wait --for=condition=ready pod -l app=ai-service -n ${{ env.K8S_NAMESPACE }} --timeout=300s || true
          kubectl wait --for=condition=ready pod -l app=parser-worker -n ${{ env.K8S_NAMESPACE }} --timeout=300s || true

      - name: Check pod status
        run: |
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          
          # Check if any pods are not running
          NOT_RUNNING=$(kubectl get pods -n ${{ env.K8S_NAMESPACE }} --field-selector=status.phase!=Running --no-headers 2>/dev/null | wc -l)
          if [ "$NOT_RUNNING" -gt "0" ]; then
            echo "Warning: Some pods are not in Running state"
            kubectl get pods -n ${{ env.K8S_NAMESPACE }} --field-selector=status.phase!=Running
          fi

      - name: Check recent pod logs
        if: failure()
        run: |
          echo "=== Auth Service Logs ==="
          kubectl logs -l app=auth-service -n ${{ env.K8S_NAMESPACE }} --tail=50 || true
          echo ""
          echo "=== Upload Service Logs ==="
          kubectl logs -l app=upload-service -n ${{ env.K8S_NAMESPACE }} --tail=50 || true
          echo ""
          echo "=== Analytics Service Logs ==="
          kubectl logs -l app=analytics-service -n ${{ env.K8S_NAMESPACE }} --tail=50 || true

  # Notification
  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy, health-check]
    if: always()
    
    steps:
      - name: Deployment Status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ] && [ "${{ needs.health-check.result }}" == "success" ]; then
            echo "✅ Deployment successful!"
            echo "Environment: ${{ github.event.inputs.environment || 'dev' }}"
            echo "Commit: ${{ github.sha }}"
          else
            echo "❌ Deployment failed!"
            echo "Build: ${{ needs.build-and-push.result }}"
            echo "Deploy: ${{ needs.deploy.result }}"
            echo "Health Check: ${{ needs.health-check.result }}"
            exit 1
          fi
